[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chimebuddy"
version = "2.0.0.dev0"
description = "Modular Twitch automation bot with a private Discord administration interface"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
chimebuddy-twitch = "chimebuddy.twitch_app:main"
chimebuddy-discord = "chimebuddy.discord_app:main"

[tool.setuptools.packages.find]
where = ["src"]