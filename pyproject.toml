[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chimebuddy"
version = "2.0.0.dev0"
description = "Modular Twitch automation bot with a private Discord administration interface"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4.0",
    "aiosqlite>=0.20,<1.0",
    "discord.py>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.scripts]
chimebuddy-twitch = "chimebuddy.twitch_app:main"
chimebuddy-discord = "chimebuddy.discord_app:main"
chimebuddy-authorize-bot = "chimebuddy.tools.authorize_bot:main"
chimebuddy-authorize-broadcaster = "chimebuddy.tools.authorize_broadcaster:main"
chimebuddy-bootstrap-test-channel = "chimebuddy.tools.bootstrap_test_channel:main"
chimebuddy-simulate-title = "chimebuddy.tools.simulate_title:main"
chimebuddy-backup-database = "chimebuddy.tools.backup_database:main"
chimebuddy-configure-ban-or-vip = "chimebuddy.tools.configure_ban_or_vip:main"
chimebuddy-list-channel-rewards = "chimebuddy.tools.list_channel_rewards:main"

[tool.setuptools.packages.find]
where = ["src"]
